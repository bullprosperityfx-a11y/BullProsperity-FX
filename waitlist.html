<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BullProsperity | Waitlist</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(212,175,55,0.10), transparent 32%),
        radial-gradient(circle at top left, rgba(212,175,55,0.06), transparent 28%),
        linear-gradient(180deg, #050505 0%, #080808 45%, #020202 100%);
      color: #fff;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .page {
      width: 100%;
      min-height: 100vh;
    }

    .navbar {
      width: 100%;
      padding: 22px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: rgba(5,5,5,0.75);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      color: #d4af37;
      letter-spacing: 0.4px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav-links a {
      color: #bdbdbd;
      font-size: 14px;
      font-weight: 700;
    }

    .nav-links a:hover {
      color: #d4af37;
    }

    .login-btn {
      padding: 11px 18px;
      border-radius: 999px;
      background: rgba(212,175,55,0.10);
      border: 1px solid rgba(212,175,55,0.35);
      color: #d4af37 !important;
      font-weight: 900 !important;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: calc(100vh - 74px);
    }

    .sidebar {
      padding: 30px 20px;
      border-right: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.015);
    }

    .side-title {
      color: #777;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    .side-card {
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.025));
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 16px;
    }

    .side-card strong {
      display: block;
      color: #d4af37;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .side-card p {
      color: #a7a7a7;
      font-size: 13px;
      line-height: 1.55;
    }

    .main {
      padding: 44px 7%;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 30px;
      align-items: stretch;
    }

    .hero-card,
    .form-card {
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.025)),
        #080808;
      border: 1px solid rgba(255,255,255,0.09);
      box-shadow: 0 25px 70px rgba(0,0,0,0.55);
    }

    .hero-card {
      padding: 42px;
      position: relative;
      overflow: hidden;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      right: -120px;
      top: -120px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(212,175,55,0.08);
      filter: blur(20px);
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(212,175,55,0.30);
      color: #d4af37;
      background: rgba(212,175,55,0.07);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 26px;
    }

    h1 {
      font-size: clamp(38px, 6vw, 72px);
      line-height: 0.98;
      letter-spacing: -2px;
      margin-bottom: 22px;
    }

    h1 span {
      color: #d4af37;
    }

    .hero-text {
      max-width: 650px;
      color: #c9c9c9;
      line-height: 1.75;
      font-size: 17px;
      margin-bottom: 30px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .primary-btn,
    .secondary-btn {
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .primary-btn {
      background: linear-gradient(135deg, #e6c65b, #9b7313);
      color: #111;
      box-shadow: 0 0 24px rgba(212,175,55,0.18);
    }

    .secondary-btn {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.10);
      color: #fff;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .mini-box {
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .mini-box strong {
      display: block;
      color: #d4af37;
      margin-bottom: 7px;
      font-size: 16px;
    }

    .mini-box small {
      color: #999;
      line-height: 1.45;
    }

    .form-card {
      padding: 28px;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      border: 1px solid rgba(212,175,55,0.22);
      background:
        linear-gradient(135deg, rgba(212,175,55,0.10), rgba(255,255,255,0.025)),
        #0b0b0b;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      color: #d4af37;
      font-size: 38px;
    }

    .form-card h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .form-card p {
      color: #aaa;
      line-height: 1.65;
      font-size: 14px;
      margin-bottom: 22px;
    }

    form {
      display: grid;
      gap: 13px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 15px 15px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.045);
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(212,175,55,0.45);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.08);
    }

    input::placeholder,
    textarea::placeholder {
      color: #777;
    }

    select {
      color: #aaa;
    }

    option {
      background: #080808;
      color: #fff;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .submit-btn {
      margin-top: 4px;
      padding: 15px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #e6c65b, #9b7313);
      color: #111;
      font-weight: 900;
      font-size: 15px;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success,
    .error {
      display: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.5;
    }

    .success {
      background: rgba(47,255,123,0.08);
      border: 1px solid rgba(47,255,123,0.22);
      color: #8dffb2;
    }

    .error {
      background: rgba(255,80,80,0.08);
      border: 1px solid rgba(255,80,80,0.22);
      color: #ff9b9b;
    }

    .section {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .feature {
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .feature h3 {
      color: #d4af37;
      font-size: 17px;
      margin-bottom: 10px;
    }

    .feature p {
      color: #a6a6a6;
      font-size: 14px;
      line-height: 1.6;
    }

    .notice {
      margin-top: 30px;
      padding: 24px;
      border-radius: 22px;
      background: rgba(212,175,55,0.055);
      border: 1px solid rgba(212,175,55,0.18);
      color: #cfcfcf;
      line-height: 1.7;
      font-size: 14px;
    }

    .notice strong {
      color: #d4af37;
    }

    footer {
      margin-top: 34px;
      padding: 24px 0 0;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .section {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .navbar {
        padding: 18px 20px;
      }

      .nav-links a:not(.login-btn) {
        display: none;
      }

      .main {
        padding: 28px 20px;
      }

      .hero-card,
      .form-card {
        padding: 24px;
      }

      .mini-grid,
      .section {
        grid-template-columns: 1fr;
      }

      h1 {
        letter-spacing: -1px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <nav class="navbar">
      <a href="index.html" class="logo">BullProsperity</a>
