<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BullProsperity | Lesson</title>
  <link rel="stylesheet" href="theme.css" />
  <script src="/login.js" defer></script>

  <script>
    (async () => {
      try {
        const res = await fetch("/api/access", {
          credentials: "include"
        });
        const data = await res.json();

        if (data.role !== "admin" && data.role !== "premium") {
          window.location.href = "locked.html";
        }
      } catch (err) {
        window.location.href = "locked.html";
      }
    })();
  </script>

  <style>
    .lesson-video-wrap{
      border:1px solid var(--line);
      border-radius:22px;
      overflow:hidden;
      background:#0c0c0c;
      max-width:900px;
      margin:18px auto 0;
      position:relative;
      padding-top:56.25%;
    }

    .lesson-video-wrap iframe{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      border:none;
    }

    .video-placeholder{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height:420px;
      color:#999;
      font-size:17px;
      text-align:center;
      background:#0c0c0c;
      gap:10px;
      padding:24px;
    }

    .video-placeholder .icon{
      font-size:30px;
    }
  </style>
</head>

<body data-protected="true">
<div class="page">

  <nav class="navbar">
    <a href="index.html" class="logo">BullProsperity | Course</a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="hub.html">Hub</a>
      <a href="course.html" class="active">Course</a>
      <a href="tools.html">Tools</a>
      <a href="setup-room.html">Setup Room</a>
      <a href="community.html">Community</a>
      <a id="loginNavBtn" href="/api/whop/login">Login</a>
    </div>
  </nav>

  <section class="lesson-main">

    <div class="lesson-main-card">

      <h2 id="lessonTitle">Lesson Titel</h2>
      <p id="lessonDescription">Lesson Beschreibung</p>

      <!-- VIDEO -->
      <div class="lesson-video-wrap" id="videoArea"></div>

    </div>

  </section>

</div>

<script>
const lessons = {
  6: {
    title: "Warum Retail Trader verlieren",
    description: "Diese Lektion zeigt dir die typischen Fehler der meisten Trader.",
    videoId: "1187000803"
  }
};

const match = window.location.pathname.match(/lesson(\d+)\.html/i);
const lessonNumber = match ? parseInt(match[1], 10) : 6;
const lesson = lessons[lessonNumber] || lessons[6];

document.getElementById("lessonTitle").textContent = lesson.title;
document.getElementById("lessonDescription").textContent = lesson.description;

const videoArea = document.getElementById("videoArea");

if (lesson.videoId) {
  videoArea.innerHTML = `
    <iframe
      src="https://player.vimeo.com/video/${lesson.videoId}?badge=0&autopause=0"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>
  `;
} else {
  videoArea.innerHTML = `
    <div class="video-placeholder">
      <div class="icon">🎬</div>
      <div>Video wird bald freigeschaltet</div>
    </div>
  `;
}
</script>

</body>
</html>
