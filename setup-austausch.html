<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BullProsperity | Setup Austausch</title>

<script>
(async () => {
  try {
    const res = await fetch("/api/access", { credentials: "include", cache: "no-store" });
    const data = await res.json();

    if (data.role !== "admin" && data.role !== "premium") {
      window.location.href = "locked.html";
    }
  } catch {
    window.location.href = "locked.html";
  }
})();
</script>

<style>
body {
  background: #0a0a0a;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  background: #111;
  border: 1px solid #333;
  color: white;
  border-radius: 8px;
}

button {
  background: gold;
  color: black;
  padding: 12px 18px;
  border: none;
  cursor: pointer;
  margin-top: 10px;
  border-radius: 8px;
  font-weight: bold;
}

.setup-card {
  border: 1px solid #333;
  padding: 15px;
  margin-top: 15px;
  border-radius: 12px;
  background: #111;
}

.setup-card img {
  max-width: 100%;
  margin-top: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>Setup Austausch</h1>
<p>Teile dein Setup mit BullProsperity. Screenshot optional.</p>

<form id="setupForm">
  <input id="name" placeholder="Name" />
  <input id="email" placeholder="Email" />

  <input id="title" placeholder="Setup Titel" required />
  <input id="market" placeholder="Markt z. B. XAUUSD, EURUSD, NAS100" required />

  <select id="bias" required>
    <option value="">Bias wählen</option>
    <option>Bullish</option>
    <option>Bearish</option>
    <option>Neutral</option>
  </select>

  <input id="setupType" placeholder="Setup Typ z. B. Liquidity Sweep + BOS" required />

  <textarea id="description" placeholder="Beschreibung..." required></textarea>

  <label>TradingView Screenshot hochladen:</label>
  <input id="screenshot" type="file" accept="image/png,image/jpeg,image/webp" />

  <button type="submit">Setup posten</button>
</form>

<h2>Meine gespeicherten Setups</h2>
<div id="savedSetups"></div>

<script>
const form = document.getElementById("setupForm");
const box = document.getElementById("savedSetups");

function getSetups() {
  return JSON.parse(localStorage.getItem("bp_setups") || "[]");
}

function saveSetups(data) {
  localStorage.setItem("bp_setups", JSON.stringify(data));
}

function render() {
  const setups = getSetups();

  if (setups.length === 0) {
    box.innerHTML = "Keine Setups gespeichert.";
    return;
  }

  box.innerHTML = setups.map((s, i) => `
    <div class="setup-card">
      <h3>${s.title}</h3>
      <p><strong>Markt:</strong> ${s.market}</p>
      <p><strong>Bias:</strong> ${s.bias}</p>
      <p><strong>Setup:</strong> ${s.setupType}</p>
      <p>${s.description}</p>
      ${s.image ? `<img src="${s.image}" alt="Setup Screenshot">` : ""}

      <button onclick="downloadSetup(${i})">Download</button>
      <button onclick="deleteSetup(${i})">Löschen</button>
    </div>
  `).join("");
}

function downloadSetup(i) {
  const s = getSetups()[i];

  const text = `
BullProsperity Setup

Titel: ${s.title}
Markt: ${s.market}
Bias: ${s.bias}
Setup: ${s.setupType}

Beschreibung:
${s.description}

Datum: ${s.date}
`;

  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = s.title.replaceAll(" ", "-") + ".txt";
  a.click();

  URL.revokeObjectURL(url);
}

function deleteSetup(i) {
  const data = getSetups();
  data.splice(i, 1);
  saveSetups(data);
  render();
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const file = document.getElementById("screenshot").files[0];

  if (file && file.size > 3000000) {
    alert("Bild ist zu groß. Bitte maximal 3 MB hochladen.");
    return;
  }

  let image = "";

  if (file) {
    image = await fileToBase64(file);
  }

  const setup = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    title: document.getElementById("title").value,
    market: document.getElementById("market").value,
    bias: document.getElementById("bias").value,
    setupType: document.getElementById("setupType").value,
    description: document.getElementById("description").value,
    image,
    date: new Date().toLocaleString("de-DE")
  };

  const data = getSetups();
  data.unshift(setup);
  saveSetups(data);
  render();

  try {
    const res = await fetch("/api/send-setup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "include",
      body: JSON.stringify(setup)
    });

    const result = await res.json();

    if (!res.ok) {
      alert(result.error || "Setup lokal gespeichert, aber nicht an Discord gesendet.");
      return;
    }

    alert("Setup wurde gespeichert und an Discord gesendet.");
    form.reset();

  } catch {
    alert("Setup lokal gespeichert, aber Discord Fehler.");
  }
});

render();
</script>

</body>
</html>
